name: Build ALKAK Admin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare ALKAK Admin Android project
        run: |
          mkdir -p app/src/main/java/com/mohamadalqaaq/alkakadmin
          mkdir -p app/src/main/assets
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/mohamadalqaaq/alkakadmin/MainActivity.java
          cp -r assets/* app/src/main/assets/
          cat << 'EOF' > settings.gradle
          rootProject.name = "ALKAK_Admin"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects {
            repositories { google(); mavenCentral() }
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.mohamadalqaaq.alkakadmin'
            compileSdk 34
            defaultConfig {
              applicationId 'com.mohamadalqaaq.alkakadmin'
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'androidx.documentfile:documentfile:1.0.1'
          }
          EOF
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALKAK-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
